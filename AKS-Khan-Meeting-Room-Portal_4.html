<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meeting Room Booking &mdash; A K S Khan Healthcare Ltd.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#12213C;
    --navy-deep:#0A1428;
    --navy-soft:#1C3055;
    --teal:#2C87A6;
    --teal-light:#5BAFC7;
    --teal-pale:#E4F1F4;
    --green:#3FA575;
    --green-pale:#E4F6ED;
    --amber:#DE9F3B;
    --amber-pale:#FBF0DD;
    --coral:#D3594B;
    --coral-pale:#FAE7E4;
    --grey-blue:#8E9FB5;
    --grey-pale:#EDEFF2;
    --slate:#57667A;
    --bg:#F3F6F7;
    --card:#FFFFFF;
    --border:#E1E7EA;
    --font-display:'Fraunces', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
    --radius:12px;
    --shadow: 0 1px 2px rgba(18,33,60,0.04), 0 8px 24px -12px rgba(18,33,60,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--font-body);
    background:var(--bg);
    color:var(--navy);
    -webkit-font-smoothing:antialiased;
    font-size:14px;
  }
  ::selection{background:var(--teal-pale);}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:14px;}
  a{color:inherit;}
  h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:-0.01em;}
  .mono{font-family:var(--font-mono);}
  #app{min-height:100vh;}

  /* ---------- Scrollbar ---------- */
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#c6d0d8;border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ---------- Login ---------- */
  .login-wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 15% 20%, rgba(44,135,166,0.16), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(63,165,117,0.14), transparent 45%),
      var(--navy-deep);
    padding:24px;
  }
  .login-card{
    width:100%;max-width:960px;
    background:var(--card);
    border-radius:20px;
    overflow:hidden;
    display:grid;
    grid-template-columns:1.1fr 1fr;
    box-shadow:0 30px 80px -20px rgba(0,0,0,0.5);
  }
  .login-side{
    background:linear-gradient(165deg, var(--navy) 0%, var(--navy-soft) 55%, var(--teal) 130%);
    color:#fff;
    padding:48px 40px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    position:relative;
    overflow:hidden;
  }
  .login-side::after{
    content:"";position:absolute;right:-60px;bottom:-60px;width:220px;height:220px;
    border-radius:50%;border:1px solid rgba(255,255,255,0.15);
  }
  .login-side::before{
    content:"";position:absolute;right:20px;bottom:-100px;width:180px;height:180px;
    border-radius:50%;border:1px solid rgba(255,255,255,0.1);
  }
  .login-logo-box{background:#fff;display:inline-flex;padding:10px 16px;border-radius:10px;width:fit-content;}
  .login-logo-box img{height:52px;display:block;}
  .login-side h1{font-size:30px;font-weight:600;line-height:1.25;margin-top:32px;color:#fff;}
  .login-side p{color:rgba(255,255,255,0.72);font-size:14px;line-height:1.6;max-width:340px;margin-top:12px;}
  .login-stats{display:flex;gap:24px;margin-top:36px;position:relative;z-index:1;}
  .login-stats div b{display:block;font-family:var(--font-display);font-size:22px;}
  .login-stats div span{font-size:11px;color:rgba(255,255,255,0.6);text-transform:uppercase;letter-spacing:0.06em;}
  .login-form{padding:48px 44px;display:flex;flex-direction:column;justify-content:center;}
  .login-form .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:0.12em;color:var(--teal);font-weight:700;margin-bottom:6px;}
  .login-form h2{font-size:24px;margin-bottom:4px;}
  .login-form .sub{color:var(--slate);font-size:13px;margin-bottom:26px;}
  .role-tabs{display:flex;gap:8px;margin-bottom:22px;background:var(--grey-pale);padding:4px;border-radius:10px;}
  .role-tab{flex:1;text-align:center;padding:9px 6px;border-radius:8px;border:none;background:transparent;font-weight:600;font-size:12.5px;color:var(--slate);transition:.15s;}
  .role-tab.active{background:#fff;color:var(--navy);box-shadow:var(--shadow);}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--slate);margin-bottom:6px;}
  .field input, .field select{
    width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:9px;
    outline:none;transition:.15s;background:#fbfcfd;
  }
  .field input:focus, .field select:focus{border-color:var(--teal);background:#fff;}
  .hint{font-size:11.5px;color:var(--grey-blue);margin-top:6px;}
  .btn{
    border:none;border-radius:9px;padding:12px 18px;font-weight:700;font-size:13.5px;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s;
  }
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{background:var(--navy-soft);}
  .btn-teal{background:var(--teal);color:#fff;}
  .btn-teal:hover{background:#256f89;}
  .btn-block{width:100%;}
  .btn-ghost{background:transparent;color:var(--slate);border:1.5px solid var(--border);}
  .btn-ghost:hover{border-color:var(--teal);color:var(--teal);}
  .btn-danger{background:var(--coral-pale);color:var(--coral);}
  .btn-danger:hover{background:var(--coral);color:#fff;}
  .btn-green{background:var(--green-pale);color:var(--green);}
  .btn-green:hover{background:var(--green);color:#fff;}
  .btn svg{width:14px;height:14px;flex-shrink:0;}
  .btn-sm{padding:7px 12px;font-size:12px;border-radius:7px;}
  .login-error{background:var(--coral-pale);color:var(--coral);padding:10px 12px;border-radius:8px;font-size:12.5px;margin-bottom:14px;font-weight:600;display:none;}
  .demo-note{margin-top:18px;font-size:11.5px;color:var(--grey-blue);line-height:1.6;border-top:1px dashed var(--border);padding-top:14px;}
  .demo-note b{color:var(--slate);}

  /* ---------- Shell ---------- */
  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:246px;flex-shrink:0;background:var(--navy-deep);color:#fff;
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
  }
  .sidebar-logo{padding:22px 20px 18px;}
  .sidebar-logo-box{background:#fff;border-radius:9px;padding:8px 12px;display:inline-flex;}
  .sidebar-logo-box img{height:36px;display:block;}
  .sidebar-role{padding:0 20px 16px;}
  .role-pill{
    display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.08);
    padding:5px 10px;border-radius:20px;font-size:11px;font-weight:700;color:var(--teal-light);
    text-transform:uppercase;letter-spacing:0.05em;
  }
  .role-pill svg{width:12px;height:12px;}
  .alt-room-chip svg{width:12px;height:12px;}
  .notif-ic svg{width:14px;height:14px;}
  .nav{flex:1;padding:6px 12px;overflow-y:auto;}
  .nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.09em;color:rgba(255,255,255,0.35);padding:14px 10px 6px;font-weight:700;}
  .nav-item{
    display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:rgba(255,255,255,0.72);
    font-size:13.5px;font-weight:600;margin-bottom:2px;border:none;background:transparent;width:100%;text-align:left;
    transition:.12s;
  }
  .nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:0.85;}
  .nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
  .nav-item.active{background:var(--teal);color:#fff;}
  .nav-item.active svg{opacity:1;}
  .nav-badge{margin-left:auto;background:var(--amber);color:#2a1c04;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:20px;}
  .sidebar-foot{padding:14px;border-top:1px solid rgba(255,255,255,0.08);}
  .user-chip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;}
  .user-avatar{width:34px;height:34px;border-radius:9px;background:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
  .user-meta{overflow:hidden;}
  .user-meta b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .user-meta span{font-size:11px;color:rgba(255,255,255,0.5);}
  .logout-btn{width:100%;margin-top:10px;background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.75);border:none;border-radius:9px;padding:9px;font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px;}
  .logout-btn:hover{background:rgba(255,255,255,0.12);color:#fff;}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 30px;background:#fff;border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:20;
  }
  .topbar h2{font-size:20px;}
  .topbar .date{font-size:12.5px;color:var(--slate);margin-top:2px;}
  .topbar-actions{display:flex;align-items:center;gap:14px;}
  .bell-btn{position:relative;width:38px;height:38px;border-radius:10px;border:1.5px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;}
  .bell-btn svg{width:17px;height:17px;color:var(--slate);}
  .bell-dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--coral);border:2px solid #fff;}
  .content{padding:28px 30px 60px;flex:1;}

  /* ---------- Cards / generic ---------- */
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);}
  .section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .section-title h3{font-size:17px;}
  .section-title .eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:0.09em;color:var(--teal);font-weight:800;margin-bottom:3px;}
  .grid{display:grid;gap:16px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  @media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}

  /* home hero buttons */
  .hero-banner{
    background:linear-gradient(120deg, var(--navy) 0%, var(--navy-soft) 60%, var(--teal) 140%);
    border-radius:18px;color:#fff;padding:34px 34px;margin-bottom:26px;position:relative;overflow:hidden;
  }
  .hero-banner::after{content:"";position:absolute;right:-40px;top:-60px;width:200px;height:200px;border-radius:50%;border:1px solid rgba(255,255,255,0.14);}
  .hero-banner h1{font-size:26px;font-weight:600;position:relative;z-index:1;}
  .hero-banner p{color:rgba(255,255,255,0.72);font-size:13.5px;margin-top:6px;max-width:480px;position:relative;z-index:1;}

  .action-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  @media(max-width:1100px){.action-grid{grid-template-columns:repeat(2,1fr);}}
  .action-tile{
    background:#fff;border:1px solid var(--border);border-radius:14px;padding:22px 18px;text-align:left;
    display:flex;flex-direction:column;gap:14px;transition:.15s;
  }
  .action-tile:hover{border-color:var(--teal);transform:translateY(-2px);box-shadow:var(--shadow);}
  .action-tile .ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
  .action-tile .ic svg{width:20px;height:20px;}
  .action-tile b{font-size:14.5px;font-family:var(--font-display);font-weight:600;}
  .action-tile span{font-size:12px;color:var(--slate);}

  .stat-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px 20px;}
  .stat-card .eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--slate);font-weight:700;}
  .stat-card b{display:block;font-family:var(--font-display);font-size:30px;margin-top:6px;}
  .stat-card .delta{font-size:11.5px;margin-top:4px;font-weight:600;}

  /* status pill */
  .status{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;}
  .status-Pending{background:var(--amber-pale);color:#96690F;}
  .status-Approved{background:var(--green-pale);color:#1E7A50;}
  .status-Rejected{background:var(--coral-pale);color:#A93A2E;}
  .status-Cancelled{background:var(--grey-pale);color:var(--slate);}
  .status-Completed{background:var(--teal-pale);color:#1D6A82;}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
  .dot-Pending{background:#DE9F3B;} .dot-Approved{background:#3FA575;} .dot-Rejected{background:#D3594B;}
  .dot-Cancelled{background:#8E9FB5;} .dot-Completed{background:#2C87A6;} .dot-avail{background:#3FA575;} .dot-busy{background:#D3594B;}

  /* forms */
  .form-card{padding:24px;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
  @media(max-width:800px){.form-row,.form-row-3{grid-template-columns:1fr;}}
  .toggle-row{display:flex;gap:10px;}
  .toggle-btn{flex:1;padding:9px;border-radius:8px;border:1.5px solid var(--border);background:#fbfcfd;font-weight:700;font-size:12.5px;color:var(--slate);}
  .toggle-btn.on{border-color:var(--teal);background:var(--teal-pale);color:var(--teal);}

  /* room cards for availability */
  .room-avail-card{border:1.5px solid var(--border);border-radius:13px;padding:16px;display:flex;flex-direction:column;gap:10px;background:#fff;}
  .room-avail-card.avail{border-color:#bfe3d0;}
  .room-avail-card.busy{border-color:#f0cec8;background:#FDFAF9;}
  .room-avail-card .rname{font-family:var(--font-display);font-size:15.5px;font-weight:600;}
  .room-avail-card .rloc{font-size:11.5px;color:var(--slate);}
  .room-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;}
  .room-tag{font-size:10.5px;background:var(--grey-pale);color:var(--slate);padding:3px 8px;border-radius:6px;font-weight:600;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--slate);padding:10px 14px;border-bottom:1.5px solid var(--border);font-weight:700;}
  td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .empty-state{padding:50px 20px;text-align:center;color:var(--slate);}
  .empty-state svg{width:38px;height:38px;color:var(--grey-blue);margin-bottom:10px;}
  .empty-state b{display:block;color:var(--navy);font-family:var(--font-display);font-size:15px;margin-bottom:4px;}
  .empty-state span{font-size:12.5px;}

  .tabs{display:flex;gap:4px;background:var(--grey-pale);padding:4px;border-radius:10px;width:fit-content;margin-bottom:18px;}
  .tab-btn{padding:8px 16px;border-radius:8px;border:none;background:transparent;font-size:12.5px;font-weight:700;color:var(--slate);}
  .tab-btn.active{background:#fff;color:var(--navy);box-shadow:var(--shadow);}

  /* calendar strip */
  .cal-wrap{overflow-x:auto;}
  .cal-grid{min-width:920px;}
  .cal-axis{display:grid;grid-template-columns:170px 1fr;border-bottom:1.5px solid var(--border);padding-bottom:8px;margin-bottom:6px;}
  .cal-axis-hours{display:grid;grid-template-columns:repeat(12,1fr);}
  .cal-axis-hours span{font-size:10.5px;color:var(--slate);font-weight:700;}
  .cal-row{display:grid;grid-template-columns:170px 1fr;align-items:center;padding:9px 0;border-bottom:1px solid #F0F3F4;}
  .cal-room-label b{font-size:12.5px;display:block;}
  .cal-room-label span{font-size:10.5px;color:var(--slate);}
  .cal-track{position:relative;height:26px;background:repeating-linear-gradient(to right, #F5F7F8 0, #F5F7F8 calc(100%/12 - 1px), #EAEDEF calc(100%/12 - 1px), #EAEDEF calc(100%/12));border-radius:6px;}
  .cal-block{position:absolute;top:2px;bottom:2px;border-radius:5px;font-size:10px;color:#fff;font-weight:700;display:flex;align-items:center;padding:0 8px;overflow:hidden;white-space:nowrap;}

  /* modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(10,20,40,0.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(2px);}
  .modal{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,0.4);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:2;}
  .modal-head h3{font-size:17px;}
  .modal-close{width:30px;height:30px;border-radius:8px;border:none;background:var(--grey-pale);display:flex;align-items:center;justify-content:center;}
  .modal-body{padding:22px 24px;}
  .modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:#fff;}
  .alert{padding:11px 14px;border-radius:9px;font-size:12.5px;font-weight:600;margin-bottom:16px;display:flex;gap:9px;align-items:flex-start;}
  .alert svg{width:15px;height:15px;flex-shrink:0;margin-top:1px;}
  .alert-error{background:var(--coral-pale);color:#A93A2E;}
  .alert-info{background:var(--teal-pale);color:#1D6A82;}
  .alert-success{background:var(--green-pale);color:#1E7A50;}
  .alt-room-chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--green);color:var(--green);font-weight:700;font-size:11.5px;padding:5px 10px;border-radius:20px;margin:4px 4px 0 0;}

  /* toast */
  .toast-stack{position:fixed;top:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:10px;}
  .toast{background:var(--navy);color:#fff;padding:13px 16px;border-radius:11px;font-size:12.5px;font-weight:600;box-shadow:0 14px 34px -10px rgba(0,0,0,0.4);display:flex;align-items:center;gap:10px;min-width:260px;animation:slidein .25s ease;}
  .toast svg{width:16px;height:16px;flex-shrink:0;}
  @keyframes slidein{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}

  .footnote{font-size:11.5px;color:var(--grey-blue);margin-top:26px;padding-top:16px;border-top:1px dashed var(--border);line-height:1.7;}
  .rooms-manage-card{padding:18px;display:flex;flex-direction:column;gap:10px;}
  .rooms-manage-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .bar-row .lbl{width:150px;font-size:12px;font-weight:600;flex-shrink:0;}
  .bar-track{flex:1;height:9px;background:var(--grey-pale);border-radius:6px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;background:var(--teal);}
  .bar-row .val{width:32px;text-align:right;font-size:12px;font-weight:700;color:var(--slate);}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-stack" id="toastStack"></div>

<script>
/* ============================ ICONS ============================ */
const ICON = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7"/><path d="M9 22V12h6v10"/><path d="M5 10v11h14V10"/></svg>',

/* ============================ SHARED LIVE SYNC ============================
   Uses the artifact's persistent shared storage (window.storage) so every
   person who opens this portal sees the same rooms/bookings/users/notifications.
   This ONLY works when the file is opened inside Claude (the artifact host
   injects window.storage). If opened as a plain downloaded HTML file in a
   normal browser, window.storage does not exist and the app falls back to
   local-only demo data (same as before) — a banner tells the user this. */
const STORAGE_KEY = 'aks-khan-meeting-room-state-v1';
const STORAGE_AVAILABLE = (typeof window !== 'undefined' && !!window.storage && typeof window.storage.get === 'function');
let lastSyncedAt = null;

function snapshotState(){
  return { ROOMS, BOOKINGS, USERS, NOTIFICATIONS, bookingSeq, notifSeq };
}
function applySnapshot(s){
  if(!s) return;
  if(Array.isArray(s.ROOMS)) ROOMS = s.ROOMS;
  if(Array.isArray(s.BOOKINGS)) BOOKINGS = s.BOOKINGS;
  if(Array.isArray(s.USERS)) USERS = s.USERS;
  if(Array.isArray(s.NOTIFICATIONS)) NOTIFICATIONS = s.NOTIFICATIONS;
  if(typeof s.bookingSeq === 'number') bookingSeq = s.bookingSeq;
  if(typeof s.notifSeq === 'number') notifSeq = s.notifSeq;
}
async function loadSharedState(){
  if(!STORAGE_AVAILABLE) return false;
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    if(res && res.value){
      applySnapshot(JSON.parse(res.value));
      lastSyncedAt = Date.now();
      return true;
    }
    return false;
  }catch(err){
    // Key doesn't exist yet (first ever run) — seed it so everyone starts from the same data.
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(snapshotState()), true);
      lastSyncedAt = Date.now();
    }catch(e2){ console.error('Could not seed shared storage', e2); }
    return false;
  }
}
async function saveSharedState(){
  if(!STORAGE_AVAILABLE) return;
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(snapshotState()), true);
    lastSyncedAt = Date.now();
  }catch(err){
    console.error('Sync failed', err);
    pushToast('Could not sync to shared storage — your change is saved locally only.','error');
  }
}
// Light polling so everyone's screen picks up other people's bookings/approvals.
function startLiveSync(){
  if(!STORAGE_AVAILABLE) return;
  setInterval(async ()=>{
    if(!state.currentUser || state.modal) return; // don't yank a form out from under someone
    const before = JSON.stringify(snapshotState());
    await loadSharedState();
    const after = JSON.stringify(snapshotState());
    if(before !== after) renderApp();
  }, 8000);
}

/* ============================ HELPERS ============================ */
function fmtDate(d){
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}
function userById(id){ return USERS.find(u=>u.id===id); }
function roomById(id){ return ROOMS.find(r=>r.id===id); }
function toMin(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function overlaps(aS,aE,bS,bE){ return toMin(aS) < toMin(bE) && toMin(bS) < toMin(aE); }
function activeBookingsFor(roomId, date, excludeId){
  return BOOKINGS.filter(b => b.roomId===roomId && b.date===date && (b.status==='Pending'||b.status==='Approved') && b.id!==excludeId);
}
function isRoomFree(roomId, date, start, end, excludeId){
  return !activeBookingsFor(roomId,date,excludeId).some(b=>overlaps(start,end,b.start,b.end));
}
function availableRoomsFor(date,start,end,minCap,excludeId){
  return ROOMS.filter(r=>r.status==='Active' && r.capacity>=minCap && isRoomFree(r.id,date,start,end,excludeId));
}
function myBookings(empId){ return BOOKINGS.filter(b=>b.empId===empId).sort((a,b)=> (a.date+a.start) < (b.date+b.start) ? 1 : -1); }
function pushToast(text, kind){
  const stack = document.getElementById('toastStack');
  const el = document.createElement('div');
  el.className='toast';
  const icon = kind==='error' ? ICON.alert : (kind==='success' ? ICON.check : ICON.bell);
  el.innerHTML = icon + '<span>'+text+'</span>';
  stack.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 3400);
}
function addNotification(userId, text, type){
  notifSeq++;
  NOTIFICATIONS.unshift({id:'N'+notifSeq, userId, text, type, time:'just now'});
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function toggleYesNo(prefix,isYes){
  document.getElementById(prefix+'Yes').classList.toggle('on', isYes);
  document.getElementById(prefix+'No').classList.toggle('on', !isYes);
}
function submitBooking(editId, roomId){
  const empName = document.getElementById('fEmpName').value.trim();
  const empIdInput = document.getElementById('fEmpId').value.trim();
  const deptInput = document.getElementById('fEmpDept').value.trim();
  const date = document.getElementById('fDate').value;
  const start = document.getElementById('fStart').value;
  const end = document.getElementById('fEnd').value;
  const participants = parseInt(document.getElementById('fPeople').value||'1',10);
  const purpose = document.getElementById('fPurpose').value.trim();
  const snacks = document.getElementById('fSnacksYes').classList.contains('on') ? 'Yes':'No';
  const snacksDetail = document.getElementById('fSnacksDetail').value.trim();
  const lunch = document.getElementById('fLunchYes').classList.contains('on') ? 'Yes':'No';
  const lunchDetail = document.getElementById('fLunchDetail').value.trim();
  const email = document.getElementById('fEmail').value.trim();
  const mobile = document.getElementById('fMobile').value.trim();
  const alertBoxEl = document.getElementById('formAlert');

  if(!empName || !empIdInput || !deptInput){ alertBoxEl.innerHTML=alertBox('error','Please fill in your name, employee ID and department.'); return; }
  if(toMin(end)<=toMin(start)){ alertBoxEl.innerHTML=alertBox('error','End time must be after the start time.'); return; }
  if(!purpose){ alertBoxEl.innerHTML=alertBox('error','Please enter the meeting purpose.'); return; }
  if(!email || !mobile){ alertBoxEl.innerHTML=alertBox('error','Official mail address and mobile number are required.'); return; }

  const room = roomById(roomId);
  if(participants > room.capacity){ alertBoxEl.innerHTML=alertBox('error',`This room seats ${room.capacity}. Reduce participants or pick another room.`); return; }

  if(!isRoomFree(roomId, date, start, end, editId||null)){
    const conflict = activeBookingsFor(roomId,date,editId||null).find(b=>overlaps(start,end,b.start,b.end));
    const alts = availableRoomsFor(date,start,end,participants, editId||null).filter(r=>r.id!==roomId);
    alertBoxEl.innerHTML = `
      <div class="alert alert-error">${ICON.alert}<span><b>This room is already booked for the selected time</b> (${conflict.start}&ndash;${conflict.end}). Booking was not submitted.</span></div>
      ${alts.length? `<div style="margin-top:-6px;margin-bottom:16px;"><div class="hint" style="margin-bottom:6px;">Try one of these instead:</div>${alts.map(r=>`<span class="alt-room-chip" onclick="openBookingForm('${r.id}')">${ICON.check} ${r.name} (${r.floor})</span>`).join('')}</div>` : ''}
    `;
    return;
  }

  const u = state.currentUser;
  if(editId){
    const b = BOOKINGS.find(x=>x.id===editId);
    Object.assign(b,{empName,empIdInput,deptInput,date,start,end,participants,purpose,snacks,snacksDetail,lunch,lunchDetail,email,mobile,status:'Pending',approvedBy:''});
    pushToast('Booking rescheduled and resent for approval.','success');
    USERS.filter(x=>x.role==='admin'||x.role==='superadmin').forEach(a=>addNotification(a.id, `${empName} rescheduled a booking for ${roomById(roomId).name}.`,'info'));
  } else {
    bookingSeq++;
    const nb = {id:'BK-'+bookingSeq, roomId, empId:u.id, empName,empIdInput,deptInput, date,start,end,participants,purpose,snacks,snacksDetail,lunch,lunchDetail,email,mobile,status:'Pending',approvedBy:'',created:TODAY,cancelReason:''};
    BOOKINGS.push(nb);
    pushToast('Booking request submitted — pending approval.','success');
    USERS.filter(x=>x.role==='admin'||x.role==='superadmin').forEach(a=>addNotification(a.id, `${empName} requested ${roomById(roomId).name} on ${fmtDate(date)}, ${start}\u2013${end}.`, 'info'));
  }
  state.editingBookingId=null; state.bookingDraft=null;
  closeModal();
  saveSharedState();
  goView(editId ? 'mybookings' : 'mybookings');
}

function availabilityResultsHTML(){
  const {availDate:date, availStart:start, availEnd:end, availPeople:people} = state;
  if(toMin(end)<=toMin(start)) return alertBox('error','End time must be after the start time.');
  const results = ROOMS.map(r=>{
    const conflict = activeBookingsFor(r.id,date).find(b=>overlaps(start,end,b.start,b.end));
    return {room:r, free: r.status==='Active' && !conflict, conflict};
  });
  return `

      ${results.map(x=>`
        <div class="room-avail-card ${x.free?'avail':'busy'}">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;">
            <div><div class="rname">${x.room.name}</div><div class="rloc">${x.room.floor} &middot; Capacity ${x.room.capacity}</div></div>
            <span class="status ${x.free?'status-Approved':'status-Rejected'}"><span class="dot ${x.free?'dot-avail':'dot-busy'}"></span>${x.room.status!=='Active'?'Inactive':(x.free?'Available':'Booked')}</span>
          </div>
          ${x.conflict?`<div class="hint">Booked ${x.conflict.start}&ndash;${x.conflict.end}</div>`:''}

  w.document.write(bookingReceiptHTML(b));

function downloadBooking(id){
  const b = BOOKINGS.find(x=>x.id===id);
  const html = bookingReceiptHTML(b);
  const blob = new Blob([html], {type:'text/html'});

  const a = document.createElement('a');
  a.href = url; a.download = 'Booking-'+b.id+'.html';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

function viewCalendar(){
  return `

        </div>

      <div style="display:flex;gap:16px;margin-top:18px;flex-wrap:wrap;">

function changeCalDate(v){ state.calDate=v; renderView(); }
function calendarRow(r){
  const dayStart=8*60, dayEnd=20*60, span=dayEnd-dayStart;
  const items = BOOKINGS.filter(b=>b.roomId===r.id && b.date===state.calDate && (b.status==='Approved'||b.status==='Pending'||b.status==='Completed'));
  const colors={Pending:'#DE9F3B',Approved:'#3FA575',Completed:'#2C87A6'};
  return `<div class="cal-row">
    <div class="cal-room-label"><b>${r.name}</b><span>${r.floor} &middot; cap ${r.capacity}</span></div>
    <div class="cal-track">
      ${items.map(b=>{
        const s=Math.max(toMin(b.start),dayStart), e=Math.min(toMin(b.end),dayEnd);
        const left=((s-dayStart)/span*100).toFixed(2), width=((e-s)/span*100).toFixed(2);
        return `<div class="cal-block" title="${b.start}-${b.end} ${esc(b.purpose)}" style="left:${left}%;width:${width}%;background:${colors[b.status]};">${b.start}&ndash;${b.end}</div>`;
      }).join('')}
    </div>
  </div>`;
}

/* ============================ ADMIN: REPORTS ============================ */
function viewReports(){
  const byDept = {};
  const byMonth = {};
  const byStatus = {};
  BOOKINGS.forEach(b=>{
    const dept = b.deptInput || 'Unspecified';
    byDept[dept] = (byDept[dept]||0)+1;
    const month = b.date.slice(0,7);
    byMonth[month] = (byMonth[month]||0)+1;
    byStatus[b.status] = (byStatus[b.status]||0)+1;
  });
  const maxDept = Math.max(...Object.values(byDept),1);
  const maxMonth = Math.max(...Object.values(byMonth),1);
  const monthLabel = m => new Date(m+'-01').toLocaleDateString('en-GB',{month:'short',year:'numeric'});
  return `
    <div class="grid grid-2" style="margin-bottom:20px;">
      <div class="card" style="padding:20px;">
        <div class="section-title"><h3>Bookings by department</h3></div>
        ${Object.entries(byDept).map(([k,v])=>`<div class="bar-row"><div class="lbl">${k}</div><div class="bar-track"><div class="bar-fill" style="width:${(v/maxDept*100).toFixed(0)}%;background:var(--teal);"></div></div><div class="val">${v}</div></div>`).join('')}
      </div>
      <div class="card" style="padding:20px;">
        <div class="section-title"><h3>Bookings by month</h3></div>
        ${Object.entries(byMonth).sort().map(([k,v])=>`<div class="bar-row"><div class="lbl">${monthLabel(k)}</div><div class="bar-track"><div class="bar-fill" style="width:${(v/maxMonth*100).toFixed(0)}%;background:var(--green);"></div></div><div class="val">${v}</div></div>`).join('')}
      </div>
    </div>
    <div class="card" style="padding:20px;">
      <div class="section-title"><h3>Status breakdown</h3></div>
      <div class="grid grid-4">
        ${['Pending','Approved','Rejected','Cancelled','Completed'].map(s=>`<div class="stat-card"><div class="eyebrow">${s}</div><b>${byStatus[s]||0}</b></div>`).join('')}
      </div>
    </div>
    <div class="footnote">Report figures are computed live from current booking records. Export tools can be wired up to your BI stack on request.</div>
  `;
}

/* ============================ SUPER ADMIN: USERS ============================ */
function viewUsers(){
  return `
    <div class="section-title"><h3>Users &amp; Admins (${USERS.length})</h3><button class="btn btn-teal btn-sm" onclick="openModal('userForm')">${ICON.plus} Add user</button></div>
    <div class="card">
      <table><thead><tr><th>Name</th><th>ID</th><th>Department</th><th>Role</th><th>Contact</th></tr></thead><tbody>
        ${USERS.map(u=>`<tr>
          <td>${u.name}</td><td class="mono">${u.id}</td><td>${u.dept}</td>
          <td><span class="status ${u.role==='superadmin'?'status-Rejected':(u.role==='admin'?'status-Pending':'status-Approved')}">${u.role==='superadmin'?'Super Admin':(u.role==='admin'?'Admin':'Employee')}</span></td>
          <td style="font-size:12px;color:var(--slate);">${u.email}<br>${u.mobile}</td>
        </tr>`).join('')}
      </tbody></table>
    </div>
    <div class="footnote">As Super Admin you can create Employee, Admin, or Super Admin accounts. Approval hierarchy and escalation rules can be configured in System Settings.</div>
  `;
}
function userFormModal(){
  return `
    <div class="modal-head"><h3>Add a user</h3><button class="modal-close" onclick="closeModal()">${ICON.x}</button></div>
    <div class="modal-body">
      <div class="form-row">
        <div class="field"><label>Full Name</label><input id="uName" placeholder="e.g. Tanvir Ahmed"/></div>
        <div class="field"><label>User / Employee ID</label><input id="uId" placeholder="e.g. 1420"/></div>
      </div>
      <div class="form-row">
        <div class="field"><label>Department</label><input id="uDept" placeholder="e.g. Human Resources"/></div>
        <div class="field"><label>Role</label><select id="uRole"><option value="employee">Employee</option><option value="admin">Admin</option><option value="superadmin">Super Admin</option></select></div>
      </div>
      <div class="form-row">
        <div class="field"><label>Official Email</label><input id="uEmail" placeholder="name@akskhan.com"/></div>
        <div class="field"><label>Mobile</label><input id="uMobile" placeholder="01xxx-xxxxxx"/></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-teal" onclick="saveUser()">Create user</button></div>
  `;
}
function saveUser(){
  const name=document.getElementById('uName').value.trim();
  const id=document.getElementById('uId').value.trim();
  const dept=document.getElementById('uDept').value.trim();
  const role=document.getElementById('uRole').value;
  const email=document.getElementById('uEmail').value.trim();
  const mobile=document.getElementById('uMobile').value.trim();
  if(!name||!id||!dept){ pushToast('Name, ID and department are required.','error'); return; }
  if(USERS.some(u=>u.id===id)){ pushToast('A user with this ID already exists.','error'); return; }
  USERS.push({id,name,dept,role,email,mobile});
  pushToast('User created.','success');
  closeModal();
  saveSharedState();
  renderApp();
}

/* ============================ SUPER ADMIN: SETTINGS ============================ */
function viewSettings(){
  return `
    <div class="grid grid-2">
      <div class="card" style="padding:20px;">
        <div class="section-title"><h3>Approval hierarchy</h3></div>
        <p style="font-size:13px;color:var(--slate);line-height:1.7;">Bookings currently route to any user with the <b>Admin</b> or <b>Super Admin</b> role. Department-level approval chains can be layered on top of this default.</p>
        <div class="toggle-row"><button class="toggle-btn on">Single-level approval</button><button class="toggle-btn">Two-level approval</button></div>

        <div class="toggle-row" style="margin-bottom:10px;"><button class="toggle-btn on">1 day before reminder</button><button class="toggle-btn on">30 min before reminder</button></div>
        <p style="font-size:12.5px;color:var(--slate);">Employees are notified automatically when a booking is submitted, approved, rejected, cancelled or rescheduled.</p>

    </div>

/* ============================ NOTIFICATIONS MODAL ============================ */
function notificationsModal(){
  const list = myNotifs();
  return `
    <div class="modal-head"><h3>Notifications</h3><button class="modal-close" onclick="closeModal()">${ICON.x}</button></div>
    <div class="modal-body">
      ${list.length ? list.map(n=>`
        <div style="display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);">
          <div class="notif-ic" style="width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:${n.type==='success'?'var(--green-pale)':(n.type==='error'?'var(--coral-pale)':'var(--teal-pale)')};color:${n.type==='success'?'var(--green)':(n.type==='error'?'var(--coral)':'var(--teal)')};">${ICON.bell}</div>
          <div><div style="font-size:12.5px;line-height:1.5;">${n.text}</div><div style="font-size:11px;color:var(--grey-blue);margin-top:3px;">${n.time}</div></div>
        </div>
      `).join('') : emptyState('bell','All caught up','No notifications right now.')}
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Close</button></div>
  `;
}

/* ============================ MODAL PLUMBING ============================ */
function openModal(key){ state.modal = key; renderModal(); }
function closeModal(){ state.modal = null; document.getElementById('modalRoot')?.remove(); }
function renderModal(){
  document.getElementById('modalRoot')?.remove();
  if(!state.modal) return;
  const root = document.createElement('div');
  root.id='modalRoot';
  root.className='modal-overlay';
  root.onclick = (e)=>{ if(e.target===root) closeModal(); };
  let inner = '';
  if(state.modal==='bookingForm') inner = bookingFormModal();
  else if(state.modal==='bookingDetail') inner = bookingDetailModal();
  else if(state.modal==='rejectForm') inner = rejectFormModal();
  else if(state.modal==='roomForm') inner = roomFormModal();
  else if(state.modal==='userForm') inner = userFormModal();
  else if(state.modal==='notifications') inner = notificationsModal();
  root.innerHTML = `<div class="modal">${inner}</div>`;
  document.body.appendChild(root);
}

/* ============================ BOOT ============================ */
function renderBootScreen(){
  document.getElementById('app').innerHTML = `
    <div class="login-wrap">
      <div style="text-align:center;color:#fff;">
        <div class="login-logo-box" style="margin:0 auto 18px;"><img src="${LOGO_SRC}" alt="A K S Khan Healthcare Ltd."/></div>
        <div style="font-size:13px;color:rgba(255,255,255,0.7);">Loading meeting room data&hellip;</div>
      </div>
    </div>`;
}
(async function boot(){
  renderBootScreen();
  await loadSharedState();
  renderLogin();
  startLiveSync();
})();
</script>
